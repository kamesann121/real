<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>FPS Shooter with Chat & Sync</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    #chat {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 10px;
      box-sizing: border-box;
    }

    #messages {
      max-height: 150px;
      overflow-y: auto;
      font-size: 14px;
    }

    #input {
      width: 100%;
      padding: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <input id="input" type="text" placeholder="チャットを入力してEnterで送信" />
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three';
    import { PointerLockControls } from 'https://cdn.skypack.dev/three/examples/jsm/controls/PointerLockControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshBasicMaterial({ color: 0x228B22 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const controls = new PointerLockControls(camera, document.body);
    document.body.addEventListener('click', () => controls.lock());

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const move = { forward: false, backward: false, left: false, right: false };

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyE') move.forward = true;
      if (e.code === 'KeyS') move.backward = true;
      if (e.code === 'KeyQ') move.left = true;
      if (e.code === 'KeyC') move.right = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyE') move.forward = false;
      if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyQ') move.left = false;
      if (e.code === 'KeyC') move.right = false;
    });

    camera.position.y = 1.6;

    // 他プレイヤーのモデル管理
    const players = new Map();

    // WebSocket通信
    const socket = new WebSocket('ws://localhost:3000');
    let myId = null;

    socket.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'id') {
        myId = data.id;
      }

      if (data.type === 'chat') {
        const msg = document.createElement('div');
        msg.textContent = `Player ${data.id}: ${data.message}`;
        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
      }

      if (data.type === 'position') {
        if (data.id === myId) return;

        let player = players.get(data.id);
        if (!player) {
          const geometry = new THREE.BoxGeometry(0.5, 1.6, 0.5);
          const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
          player = new THREE.Mesh(geometry, material);
          scene.add(player);
          players.set(data.id, player);
        }
        player.position.set(data.x, data.y, data.z);
      }

      if (data.type === 'leave') {
        const player = players.get(data.id);
        if (player) {
          scene.remove(player);
          players.delete(data.id);
        }
      }
    });

    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        socket.send(JSON.stringify({ type: 'chat', message: input.value }));
        input.value = '';
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      direction.z = Number(move.forward) - Number(move.backward);
      direction.x = Number(move.right) - Number(move.left);
      direction.normalize();

      if (controls.isLocked) {
        velocity.x = direction.x * 0.1;
        velocity.z = direction.z * 0.1;
        controls.moveRight(velocity.x);
        controls.moveForward(velocity.z);

        // 自分の位置を送信
        const pos = camera.position;
        socket.send(JSON.stringify({ type: 'position', x: pos.x, y: pos.y, z: pos.z }));
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
